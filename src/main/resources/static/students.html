<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
    <nav class="navbar">
        <h2>📋 AMS - Manage Students</h2>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/attendance">Mark Attendance</a>
            <a href="/students">Students</a>
            <a href="/report">Report</a>
            <a href="/login-logs">Login Logs</a>
            <a href="/leave-management">Leave</a>
            <a href="/announcements">Announcements</a>
            <a href="/notifications">Notifications</a>
            <a href="/profile">Profile</a>
            <a href="/logout" class="btn-logout">Logout</a>
        </div>
    </nav>
    <div class="content">
        <h1>Manage Students</h1>

        <div class="form-section">
            <h3>Add New Student</h3>
            <form action="/add-student" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label>Username:</label>
                        <input type="text" name="username" required>
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <div style="position:relative;">
                            <input type="password" name="password" id="newStudentPwd" required style="padding-right:40px;">
                            <button type="button" id="toggleNewStudentPwd" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#999;display:flex;padding:4px;"></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" name="name" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone:</label>
                        <input type="text" name="phone">
                    </div>
                    <div class="form-group">
                        <label>Department:</label>
                        <input type="text" name="department" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Year:</label>
                        <input type="text" name="year" required>
                    </div>
                    <div class="form-group">
                        <label>Section:</label>
                        <input type="text" name="section" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-staff">Add Student</button>
            </form>
        </div>

        <h3>Student List</h3>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Year</th>
                <th>Section</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="studentsTableBody">
            <tr><td colspan="8" style="text-align:center;color:#999;">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script>
    fetch('/api/check-session')
        .then(res => res.json())
        .then(data => {
            if (!data.loggedIn || data.role !== 'staff') {
                window.location.href = '/staff-login';
            }
        });

    (function() {
        const EYE_OPEN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const EYE_CLOSED = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.42M1 1l22 22"/></svg>';
        const toggle = document.getElementById('toggleNewStudentPwd');
        const input = document.getElementById('newStudentPwd');
        toggle.innerHTML = EYE_OPEN;
        toggle.addEventListener('click', () => {
            const isPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isPassword ? 'text' : 'password');
            toggle.innerHTML = isPassword ? EYE_CLOSED : EYE_OPEN;
        });
    })();

    function loadStudents() {
        fetch('/api/students')
            .then(res => res.json())
            .then(students => {
                const tbody = document.getElementById('studentsTableBody');
                if (!students.length) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;">No students found.</td></tr>';
                    return;
                }
                tbody.innerHTML = students.map(s => `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.username}</td>
                        <td>${s.name}</td>
                        <td>${s.email}</td>
                        <td>${s.department}</td>
                        <td>${s.year}</td>
                        <td>${s.section}</td>
                        <td><button class="btn-delete" onclick="deleteStudent(${s.id})">Delete</button></td>
                    </tr>
                `).join('');
            });
    }

    function deleteStudent(id) {
        if (!confirm('Delete this student?')) return;
        fetch('/delete-student/' + id, { method: 'POST' })
            .then(() => loadStudents());
    }

    loadStudents();
</script>
</body>
</html>
