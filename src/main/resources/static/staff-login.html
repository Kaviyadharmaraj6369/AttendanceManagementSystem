<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - Attendance System</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --secondary: #764ba2;
            --text: #2d3748;
            --muted: #718096;
            --border: #e2e8f0;
            --bg: #f7f8fc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 15% 20%, #7c8ff0 0%, transparent 45%),
            radial-gradient(circle at 85% 80%, #9a6fc9 0%, transparent 45%),
            linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(35, 25, 90, 0.35);
            overflow: hidden;
            max-width: 460px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 38px 30px 30px;
            text-align: center;
            position: relative;
        }
        .login-header::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: -1px; height: 24px;
            background: white;
            border-radius: 24px 24px 0 0;
        }
        .login-header .icon {
            font-size: 3em; margin-bottom: 10px; display: inline-flex; align-items: center; justify-content: center;
            width: 72px; height: 72px; background: rgba(255,255,255,0.18); border-radius: 50%;
        }
        .login-header h1 { font-size: 1.7em; margin-top: 12px; font-weight: 700; letter-spacing: 0.3px; }
        .login-header p { opacity: 0.9; font-size: 0.9em; margin-top: 4px; }
        .login-body { padding: 10px 30px 34px; }

        .tab-switch {
            display: flex;
            background: var(--bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 22px;
            position: relative;
        }
        .tab-switch button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 11px 0;
            font-weight: 700;
            font-size: 0.95em;
            color: var(--muted);
            cursor: pointer;
            border-radius: 9px;
            z-index: 1;
            transition: color 0.25s;
        }
        .tab-switch button.active { color: white; }
        .tab-switch .slider {
            position: absolute;
            top: 4px; bottom: 4px; left: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 9px;
            transition: transform 0.25s ease;
            box-shadow: 0 4px 12px rgba(102,126,234,0.35);
        }
        .tab-switch .slider.to-register { transform: translateX(100%); }

        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 0.92em;
            display: none;
        }
        .message.show { display: block; }
        .message.error { background: #fee2e2; color: #b91c1c; border-left: 4px solid #dc2626; }
        .message.success { background: #dcfce7; color: #15803d; border-left: 4px solid #16a34a; }
        .message.info { background: #eef2ff; color: #4338ca; border-left: 4px solid #6366f1; }

        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { display: block; margin-bottom: 7px; color: var(--text); font-weight: 600; font-size: 0.9em; }
        .input-wrapper { position: relative; }
        .input-wrapper .field-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--primary); display: flex;
        }
        .form-group input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.98em;
            background: #fbfbfe;
            transition: all 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12); background: white; }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            padding: 6px;
            display: flex;
            border-radius: 6px;
        }
        .password-toggle:hover { color: var(--primary); background: #eef0fd; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.02em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 6px;
            letter-spacing: 0.2px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(102, 126, 234, 0.4); }
        .btn-submit:active { transform: translateY(0); }

        .back-link { text-align: center; margin-top: 18px; }
        .back-link a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 0.9em; }
        .back-link a:hover { color: var(--primary); }

        .demo-credentials {
            background: var(--bg);
            padding: 13px 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            border: 1px dashed var(--border);
        }
        .demo-credentials p { color: var(--muted); font-size: 0.85em; margin-bottom: 4px; }
        .demo-credentials strong { color: var(--primary); font-size: 0.95em; }

        .role-switch { text-align: center; margin-top: 4px; font-size: 0.85em; color: var(--muted); }
        .role-switch a { color: #11998e; font-weight: 700; text-decoration: none; }
        .role-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <span class="icon">🧑‍💼</span>
        <h1>Staff Portal</h1>
        <p>Manage attendance, students & reports</p>
    </div>
    <div class="login-body">
        <div class="tab-switch">
            <div class="slider" id="tabSlider"></div>
            <button type="button" id="loginTabBtn" class="active" onclick="showTab('login')">Login</button>
            <button type="button" id="registerTabBtn" onclick="showTab('register')">Register</button>
        </div>

        <div class="message error" id="errorMsg"></div>
        <div class="message success" id="successMsg"></div>
        <div class="message info" id="infoMsg"></div>

        <!-- LOGIN PANEL -->
        <div class="panel active" id="loginPanel">
            <form action="/staff-login" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" name="username" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" class="pwd-input" name="password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle pwd-toggle"></button>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Login to Dashboard</button>
            </form>

        </div>

        <!-- REGISTER PANEL -->
        <div class="panel" id="registerPanel">
            <form action="/register-staff" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" name="username" placeholder="Choose a username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" class="pwd-input" name="password" placeholder="Choose a password" required minlength="4">
                        <button type="button" class="password-toggle pwd-toggle"></button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" name="name" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6 12 13 2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
                        </span>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1M9 21v-4h6v4"/></svg>
                        </span>
                        <input type="text" name="department" placeholder="Enter department" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Create Staff Account</button>
            </form>
        </div>

        <div class="role-switch">Student instead? <a href="/student-login">Go to Student Portal</a></div>
        <div class="back-link"><a href="/">← Back to Home</a></div>
    </div>
</div>
<script>
    const EYE_OPEN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_CLOSED = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.42M1 1l22 22"/></svg>';

    document.querySelectorAll('.pwd-toggle').forEach(btn => {
        btn.innerHTML = EYE_OPEN;
        const input = btn.parentElement.querySelector('.pwd-input');
        btn.addEventListener('click', () => {
            const isPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isPassword ? 'text' : 'password');
            btn.innerHTML = isPassword ? EYE_CLOSED : EYE_OPEN;
        });
    });

    function showTab(tab) {
        const isRegister = tab === 'register';
        document.getElementById('loginTabBtn').classList.toggle('active', !isRegister);
        document.getElementById('registerTabBtn').classList.toggle('active', isRegister);
        document.getElementById('loginPanel').classList.toggle('active', !isRegister);
        document.getElementById('registerPanel').classList.toggle('active', isRegister);
        document.getElementById('tabSlider').classList.toggle('to-register', isRegister);
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'register') showTab('register');

    const error = params.get('error');
    const errorBox = document.getElementById('errorMsg');
    if (error === 'notfound') {
        showTab('login');
        errorBox.textContent = 'Invalid username! No account found — you can register below.';
        errorBox.classList.add('show');
    } else if (error === 'wrongpassword' || error === 'true') {
        showTab('login');
        errorBox.textContent = 'Invalid password! Please try again.';
        errorBox.classList.add('show');
    } else if (error === 'system') {
        errorBox.textContent = 'Something went wrong. Please try again.';
        errorBox.classList.add('show');
    } else if (error === 'already_registered') {
        showTab('login');
        document.getElementById('infoMsg').textContent = "You're already registered! Please login below.";
        document.getElementById('infoMsg').classList.add('show');
    } else if (error === 'username_exists') {
        errorBox.textContent = 'That username is already taken. Please choose another.';
        errorBox.classList.add('show');
    }

    if (params.get('registered') === 'true') {
        document.getElementById('successMsg').textContent = 'Registration successful! Please login below.';
        document.getElementById('successMsg').classList.add('show');
    }

    if (params.get('notice') === 'notfound') {
        document.getElementById('infoMsg').textContent = "We couldn't find that account — create one below.";
        document.getElementById('infoMsg').classList.add('show');
    }
</script>
</body>
</html>
