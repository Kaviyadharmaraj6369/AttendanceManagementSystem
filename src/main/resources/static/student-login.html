<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Attendance Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .login-header .icon { font-size: 3.5em; margin-bottom: 15px; display: block; }
        .login-header h1 { font-size: 2em; margin-bottom: 8px; font-weight: 600; }
        .login-header p { opacity: 0.9; font-size: 0.95em; }
        .login-body { padding: 40px 30px; }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            display: none;
        }
        .error-message.show { display: block; }
        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3c3;
            display: none;
        }
        .success-message.show { display: block; }
        .form-group { margin-bottom: 25px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 0.95em; }
        .input-wrapper { position: relative; }
        .input-wrapper .icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999; font-size: 1.1em; }
        .form-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }
        .form-group input:focus { border-color: #11998e; outline: none; box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.1); }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.1em;
            padding: 5px;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(17, 153, 142, 0.4); }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #11998e; text-decoration: none; font-weight: 500; }
        .back-link a:hover { text-decoration: underline; }
        .demo-credentials {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            text-align: center;
            border-left: 4px solid #11998e;
        }
        .demo-credentials p { color: #666; font-size: 0.9em; margin-bottom: 5px; }
        .demo-credentials strong { color: #11998e; font-size: 1em; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <span class="icon">🎓</span>
        <h1>Student Login</h1>
        <p>Access your attendance records</p>
    </div>
    <div class="login-body">
        <div class="error-message" id="errorMsg">❌ Invalid username or password!</div>
        <div class="success-message" id="successMsg">✅ Registration successful! Please login.</div>
        <form id="loginForm" action="/student-login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <span class="icon">👤</span>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" id="togglePassword">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn-login"> Login to Dashboard</button>
        </form>

        <div class="back-link"><a href="/">← Back to Home</a></div>
    </div>
</div>
<script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'text' ? '🙈' : '👁️';
    });
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'true') document.getElementById('errorMsg').classList.add('show');
    if (urlParams.get('registered') === 'true') document.getElementById('successMsg').classList.add('show');
</script>
</body>
</html>
